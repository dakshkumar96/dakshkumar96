<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" font-family="'Courier New', Courier, monospace"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="420" height="220" fill="#0D1117"/><rect x="6" y="6" width="408" height="208" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="10" y="18" width="4" height="184" rx="2" fill="#3FB950"/><text x="30" y="40" text-anchor="start" fill="#F0F6FC" font-size="18" font-weight="700">Sentinel</text><text x="30" y="62" text-anchor="start" fill="#3FB950" font-size="11">Next.js · TypeScript · Claude API</text><text x="30" y="92" text-anchor="start" fill="#8B949E" font-size="12">Agentic ad-ops dashboard, built in two hours at</text><text x="30" y="110" text-anchor="start" fill="#8B949E" font-size="12">the Cursor Adtech Hackathon. An agent plans and</text><text x="30" y="128" text-anchor="start" fill="#8B949E" font-size="12">executes campaign actions through tool calls,</text><text x="30" y="146" text-anchor="start" fill="#8B949E" font-size="12">with every action logged so a human can see</text><text x="30" y="164" text-anchor="start" fill="#8B949E" font-size="12">exactly what it did and why before it happens</text><text x="30" y="182" text-anchor="start" fill="#8B949E" font-size="12">again.</text></svg>