<svg xmlns="http://www.w3.org/2000/svg" width="420" height="202" viewBox="0 0 420 202" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"><rect width="420" height="202" fill="#FFFFFF"/><rect x="6" y="6" width="408" height="190" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><rect x="6" y="6" width="6" height="190" rx="3" fill="#3B82F6"/><text x="30" y="40" text-anchor="start" fill="#1F2328" font-size="18" font-weight="700">rv-ml</text><text x="30" y="62" text-anchor="start" fill="#3B82F6" font-size="11">Python · Conformal Prediction · Simulation-Based ML</text><text x="30" y="92" text-anchor="start" fill="#57606A" font-size="12">Predicting Keplerian orbital parameters from radial-</text><text x="30" y="110" text-anchor="start" fill="#57606A" font-size="12">velocity time series, with conformal prediction</text><text x="30" y="128" text-anchor="start" fill="#57606A" font-size="12">intervals calibrated on synthetic data that stay</text><text x="30" y="146" text-anchor="start" fill="#57606A" font-size="12">valid on real stars. Co-authored UROP work,</text><text x="30" y="164" text-anchor="start" fill="#57606A" font-size="12">submitted to AAAI.</text></svg>