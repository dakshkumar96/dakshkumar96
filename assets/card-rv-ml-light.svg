<svg xmlns="http://www.w3.org/2000/svg" width="420" height="202" viewBox="0 0 420 202" font-family="'Courier New', Courier, monospace"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="420" height="202" fill="#FFFFFF"/><rect x="6" y="6" width="408" height="190" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><rect x="10" y="18" width="4" height="166" rx="2" fill="#4AF626"/><text x="30" y="40" text-anchor="start" fill="#1F2328" font-size="18" font-weight="700">rv-ml</text><text x="30" y="62" text-anchor="start" fill="#4AF626" font-size="11">Python · Conformal Prediction · Simulation-Based ML</text><text x="30" y="92" text-anchor="start" fill="#57606A" font-size="12">Predicting Keplerian orbital parameters from</text><text x="30" y="110" text-anchor="start" fill="#57606A" font-size="12">radial-velocity time series, with conformal</text><text x="30" y="128" text-anchor="start" fill="#57606A" font-size="12">prediction intervals calibrated on synthetic</text><text x="30" y="146" text-anchor="start" fill="#57606A" font-size="12">data that stay valid on real stars. Co-authored</text><text x="30" y="164" text-anchor="start" fill="#57606A" font-size="12">UROP work, submitted to AAAI.</text></svg>