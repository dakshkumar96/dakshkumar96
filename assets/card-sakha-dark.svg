<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" font-family="'Courier New', Courier, monospace"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="420" height="220" fill="#0D1117"/><rect x="6" y="6" width="408" height="208" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="10" y="18" width="4" height="184" rx="2" fill="#3FB950"/><text x="30" y="40" text-anchor="start" fill="#F0F6FC" font-size="18" font-weight="700">Sakha</text><text x="30" y="62" text-anchor="start" fill="#3FB950" font-size="11">Python · FastAPI · FAISS · Next.js · Gemini</text><text x="30" y="92" text-anchor="start" fill="#8B949E" font-size="12">Voice-first RAG companion for the Bhagavad Gita.</text><text x="30" y="110" text-anchor="start" fill="#8B949E" font-size="12">Every answer is citation-grounded against the</text><text x="30" y="128" text-anchor="start" fill="#8B949E" font-size="12">source text, a teach-gate stops scripture from</text><text x="30" y="146" text-anchor="start" fill="#8B949E" font-size="12">being served without context, and a crisis-</text><text x="30" y="164" text-anchor="start" fill="#8B949E" font-size="12">language classifier routes distress signals to</text><text x="30" y="182" text-anchor="start" fill="#8B949E" font-size="12">real helplines instead of a generic response.</text></svg>