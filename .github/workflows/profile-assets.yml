name: Update Profile Assets

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

# Queue runs on main instead of letting them overlap. Without this, two
# pushes close together (e.g. two quick manual README edits) each start
# their own run, and whichever run's final "git push" loses the race gets
# rejected outright — no retry, job just fails. cancel-in-progress stays
# false so a run that's already mid-regeneration finishes and commits
# instead of being cut off.
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dakshkumar96
          # custom Claude-orange palette instead of the built-in github-dark/
          # github-light presets, which render the contribution grid in
          # GitHub's green
          outputs: |
            dist/snake-dark.svg?color_snake=#da7756&color_dots=#161b22,#5a3324,#9c4f30,#c2643f,#da7756
            dist/snake-light.svg?color_snake=#bd5d3a&color_dots=#ebedf0,#f0a882,#e58f60,#da7756,#bd5d3a

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate profile assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: dakshkumar96
        run: |
          python scripts/hero.py
          python scripts/radar.py
          python scripts/radar_langs.py
          python scripts/commit_line.py
          python scripts/card_stats.py
          python scripts/numbers.py
          python scripts/project_cards.py

      - name: Commit generated assets back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: regenerate profile assets [skip ci]"
          # concurrency: above serializes runs so this should always be a
          # fast-forward, but rebase-and-retry once anyway in case a human
          # push landed on main in the moment between checkout and here
          git push || (git pull --rebase origin main && git push)

      - name: Publish snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
