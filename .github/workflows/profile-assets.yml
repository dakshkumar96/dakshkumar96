name: Update Profile Assets

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

# Queue runs on main instead of letting them overlap. Without this, two
# pushes close together (e.g. two quick manual README edits) each start
# their own run, and whichever run's final "git push" loses the race gets
# rejected outright — no retry, job just fails. cancel-in-progress stays
# false so a run that's already mid-regeneration finishes and commits
# instead of being cut off.
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dakshkumar96
          # custom palette (not snk's built-in github-dark/github-light —
          # unverified param syntax isn't worth risking on a working CI
          # step) built from the exact same Primer green tokens as
          # svgkit.py, so the snake matches the rest of the page
          outputs: |
            dist/snake-dark.svg?color_snake=#3fb950&color_dots=#161b22,#20432e,#2b6a39,#359245,#3fb950
            dist/snake-light.svg?color_snake=#116329&color_dots=#ebedf0,#4ac26b,#32a151,#1a7f37,#116329

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate profile assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: dakshkumar96
        run: |
          python scripts/hero.py
          python scripts/radar.py
          python scripts/radar_langs.py
          python scripts/commit_line.py
          python scripts/card_stats.py
          python scripts/numbers.py
          python scripts/project_cards.py

      - name: Commit generated assets back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: dakshkumar96
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # concurrency: above serializes runs, but a human push can still
          # land on main in the moment between this run's checkout and its
          # push here. A plain rebase-and-retry (the previous version of
          # this step) only handles a clean fast-forward — it fails outright
          # on an actual content conflict between two regenerations of the
          # same generated file (confirmed happening: run 35910532048,
          # 2026-09-23, conflicted on card-stats/commit-line SVGs and gave
          # up). These files are 100% machine-generated from live data with
          # no hand-authored content to preserve, so there's nothing to
          # "merge" — on conflict, the correct fix is to discard the stale
          # regeneration and regenerate fresh against whatever just landed,
          # not resolve a diff between two snapshots of a live number.
          for attempt in 1 2 3; do
            git add assets/
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "chore: regenerate profile assets [skip ci]"
            if git push; then
              exit 0
            fi

            echo "push rejected (attempt $attempt/3) -- resyncing to origin/main and regenerating fresh"
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            python scripts/hero.py
            python scripts/radar.py
            python scripts/radar_langs.py
            python scripts/commit_line.py
            python scripts/card_stats.py
            python scripts/numbers.py
            python scripts/project_cards.py
          done

          echo "::error::could not push generated assets after 3 attempts"
          exit 1

      - name: Publish snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
