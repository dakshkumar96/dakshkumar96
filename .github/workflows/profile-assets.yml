name: Update Profile Assets

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dakshkumar96
          # custom blue palette instead of the built-in github-dark/github-light
          # presets, which render the contribution grid in GitHub's green
          outputs: |
            dist/snake-dark.svg?color_snake=#3b82f6&color_dots=#161b22,#1e3a5f,#1d4ed8,#2563eb,#3b82f6
            dist/snake-light.svg?color_snake=#1d4ed8&color_dots=#ebedf0,#93c5fd,#60a5fa,#3b82f6,#1d4ed8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate profile assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: dakshkumar96
        run: |
          python scripts/portrait.py
          python scripts/radar.py
          python scripts/radar_langs.py
          python scripts/metrics.py
          python scripts/commit_line.py
          python scripts/card_stats.py
          python scripts/project_cards.py

      - name: Commit generated assets back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: regenerate profile assets [skip ci]"
          git push

      - name: Publish snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
